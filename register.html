    <script src="AuthGame_files/mask.js" type="text/javascript"></script>

<body class="">
    <div class="login-pf-page">
        <div id="kc-header" class="login-pf-page-header">
            <div id="kc-header-wrapper" class="">Cadastro</div>
        </div>
        <div id="rc-page">
            <div class="card-pf">
                <header class="login-pf-header">

                    <div id="kc-username" class="form-group">
                        <label id="kc-attempted-username" class="text-uppercase">Crie seu usuário</label>
                        <!--
                                <a id="reset-login" href="http://localhost:8080/realms/Playground/login-actions/restart?client_id=account-console&amp;tab_id=uNQcgUJoKtU&amp;client_data=eyJydSI6Imh0dHA6Ly9sb2NhbGhvc3Q6ODA4MC9yZWFsbXMvUGxheWdyb3VuZC9hY2NvdW50IiwicnQiOiJjb2RlIn0&amp;skip_logout=false" aria-label="Reiniciar o login">
                                    <div class="kc-login-tooltip">
                                        <i class="pficon pficon-arrow fa"></i>
                                        <span class="kc-tooltip-text">Reiniciar o login</span>
                                    </div>
                                </a>
                            -->
                    </div>
                </header>
                <div id="kc-content">
                    <div id="kc-content-wrapper">


                        <label for="usuario" class="pf-c-form__label pf-c-form__label-text">Usuário</label>
                        <input id="usuario" placeholder="Usuário" class="pf-c-form-control" name="usuario">

                        <br><br>

                        <div class="select-mode" style="margin-bottom: 10px;">
                            <button id="modeToggle" type="button">Modo: Placar</button>
                        </div>


                        <div id="passwordEntropy" style="margin-top: 10px; font-weight: bold; color: #555;"></div>

                        <br>

                        <label for="password" class="pf-c-form__label pf-c-form__label-text">Senha</label>
                        <div class="pf-c-input-group" dir="ltr">
                            <input tabindex="2" id="password" class="pf-c-form-control" name="password" type="password"
                                autocomplete="on" autofocus="" aria-invalid="">
                        </div>

                        <div id="passwordFeedback" style="
margin-top:10px;
font-weight:bold;
">
                        </div>

                        <br>

                        <button onclick="cadastrar()" class="pf-c-button pf-m-primary pf-m-block btn-lg">

                            Cadastrar

                        </button>

                        <script>

                            const senha =
                                document
                                    .getElementById(
                                        "password"
                                    );

                            const modo =
                                document
                                    .getElementById(
                                        "modeToggle"
                                    );

                            const feedback =
                                document
                                    .getElementById(
                                        "passwordFeedback"
                                    );

                            function cadastrar() {

                                const usuario =
                                    document
                                        .getElementById(
                                            "usuario"
                                        )
                                        .value;

                                const senha =
                                    document
                                        .getElementById(
                                            "password"
                                        )
                                        .value;

                                if (
                                    !usuario ||
                                    !senha
                                ) {

                                    alert(
                                        "Preencha tudo"
                                    );

                                    return;

                                }

                                localStorage.setItem(
                                    "usuario",
                                    usuario
                                );

                                localStorage.setItem(
                                    "senha",
                                    senha
                                );

                                localStorage.setItem(
                                    "passwordMode",
                                    modo.value
                                );

                                alert(
                                    "Conta criada!"
                                );

                                window.location.href =
                                    "AuthGame.html";

                            }

                            atualizar();

                        </script>


                    </div>
                    <script type="module" src="AuthGame_files/entropy.js"></script>
                    <script type="module" src="AuthGame_files/passwordVisibility.js"></script>
                    <script type="module" src="AuthGame_files/zxcvbn.js"></script>

</body>
