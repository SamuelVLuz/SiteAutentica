<!DOCTYPE html>
<html class="login-pf" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Portal de Notas - Criar conta</title>
    <link href="AuthGame_files/patternfly.min.css" rel="stylesheet">
    <link href="AuthGame_files/patternfly(1).min.css" rel="stylesheet">
    <link href="AuthGame_files/patternfly-additions.min.css" rel="stylesheet">
    <link href="AuthGame_files/pficon.css" rel="stylesheet">
    <link href="AuthGame_files/login.css" rel="stylesheet">
    <link href="AuthGame_files/styles.css?v=layout-20260830" rel="stylesheet">
    <link href="AuthGame_files/footer.css" rel="stylesheet">
</head>

<body>
    <main class="login-pf-page auth-page auth-page--register">
        <header id="kc-header" class="login-pf-page-header">
            <a id="kc-header-wrapper" href="AuthGame.html" aria-label="Portal de Notas">Portal de Notas</a>
        </header>

        <section id="rc-page" aria-labelledby="register-title">
            <div class="auth-shell auth-shell--single">
                <header class="login-pf-header">
                    <p class="auth-eyebrow">Portal de Notas</p>
                    <h1 id="register-title">Criar conta</h1>
                    <p class="auth-card__intro">Escolha suas credenciais para acessar o Portal de Notas.</p>
                </header>

                <div id="kc-content">
                    <form id="kc-register-form">
                        <div class="form-group">
                            <label for="usuario" class="pf-c-form__label pf-c-form__label-text">Usuário acadêmico</label>
                            <input id="usuario" placeholder="Escolha seu usuário" class="pf-c-form-control" name="usuario"
                                autocomplete="username" required>
                        </div>

                        <div class="form-group no-bottom-margin">
                            <label for="password" class="pf-c-form__label pf-c-form__label-text">Crie uma senha</label>
                            <div class="pf-c-input-group" dir="ltr">
                                <input id="password" class="pf-c-form-control" name="password" type="password"
                                    autocomplete="new-password" aria-invalid="false" required>
                                <button class="pf-c-button pf-m-control" type="button" aria-label="Mostrar senha"
                                    aria-controls="password" data-password-toggle data-label-show="Mostrar senha"
                                    data-label-hide="Ocultar senha">Ver</button>
                            </div>

                            <div class="select-mode">
                                <button id="modeToggle" type="button">Modo: Comparação</button>
                            </div>
                            <div id="passwordEntropy" aria-live="polite"></div>
                        </div>

                        <div class="auth-actions">
                            <button type="submit" class="pf-c-button pf-m-primary pf-m-block btn-lg">Criar conta</button>
                        </div>
                    </form>

                    <footer class="auth-card__footer">
                        <span>Já tem uma conta?</span>
                        <a href="AuthGame.html">Entrar</a>
                    </footer>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById("kc-register-form").addEventListener("submit", function (event) {
            event.preventDefault();
            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("password").value;

            if (!usuario || !senha) return;

            localStorage.setItem("usuario", usuario);
            localStorage.setItem("senha", senha);
            localStorage.setItem("passwordMode", localStorage.getItem("passwordMode") || "score");
            alert("Conta criada! Agora é só entrar.");
            window.location.href = "AuthGame.html";
        });
    </script>
    <script type="module" src="AuthGame_files/entropy.js"></script>
    <script type="module" src="AuthGame_files/passwordVisibility.js"></script>
    <script type="module" src="AuthGame_files/zxcvbn.js"></script>
</body>

</html>
