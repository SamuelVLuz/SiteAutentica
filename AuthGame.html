    <script>

        window.addEventListener(
            "DOMContentLoaded",
            function () {

                const modoSelecionado =
                    localStorage.getItem(
                        "passwordMode"
                    );

                // aplica modo salvo (se existir)
                if (
                    modoSelecionado &&
                    typeof setMode === "function"
                ) {
                    setMode(
                        modoSelecionado
                    );
                }

                document
                    .getElementById(
                        "kc-form-login"
                    )
                    .addEventListener(
                        "submit",
                        function (event) {

                            event.preventDefault();

                            const usuarioDigitado =
                                document
                                    .getElementById(
                                        "usuario"
                                    )
                                    .value;

                            const senhaDigitada =
                                document
                                    .getElementById(
                                        "password"
                                    )
                                    .value;

                            const usuarioSalvo =
                                localStorage.getItem(
                                    "usuario"
                                );

                            const senhaSalva =
                                localStorage.getItem(
                                    "senha"
                                );

                            if (
                                !usuarioSalvo ||
                                !senhaSalva
                            ) {

                                alert(
                                    "Crie uma conta primeiro"
                                );

                                return;

                            }

                            if (
                                usuarioDigitado ===
                                usuarioSalvo &&
                                senhaDigitada ===
                                senhaSalva
                            ) {

                                alert(
                                    "Login realizado!"
                                );

                                // trocar depois
                                // window.location.href="home.html";

                            }
                            else {

                                alert(
                                    "Usuário ou senha incorretos"
                                );

                            }

                        });

            });

    </script>
